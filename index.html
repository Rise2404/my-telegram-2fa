<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2FA Authenticator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/otpauth/dist/otpauth.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            tg: "var(--tg-theme-bg-color, #0f172a)",
            tgtext: "var(--tg-theme-text-color, #f8fafc)"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans select-none">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative">
    <div class="flex items-center justify-between mb-6">
      <div class="flex-1 mr-2">
        <label class="block text-xs font-medium text-slate-400 mb-1">Сервис</label>
        <select id="accountSelect" class="w-full bg-slate-800 border border-slate-700 text-white rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer"></select>
      </div>
      <button id="addBtn" class="mt-4 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-400 border border-indigo-500/30 rounded-xl p-2.5 transition active:scale-95" type="button">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
      </button>
    </div>

    <div id="otpRow" class="flex justify-center items-center gap-2 sm:gap-3 my-6">
      <div class="otp-box w-11 h-14 sm:w-12 sm:h-16 flex items-center justify-center bg-slate-800/80 border-2 border-indigo-500/40 rounded-xl text-2xl sm:text-3xl font-mono font-bold text-white shadow-inner">-</div>
      <div class="otp-box w-11 h-14 sm:w-12 sm:h-16 flex items-center justify-center bg-slate-800/80 border-2 border-indigo-500/40 rounded-xl text-2xl sm:text-3xl font-mono font-bold text-white shadow-inner">-</div>
      <div class="otp-box w-11 h-14 sm:w-12 sm:h-16 flex items-center justify-center bg-slate-800/80 border-2 border-indigo-500/40 rounded-xl text-2xl sm:text-3xl font-mono font-bold text-white shadow-inner">-</div>
      <div class="otp-box w-11 h-14 sm:w-12 sm:h-16 flex items-center justify-center bg-slate-800/80 border-2 border-indigo-500/40 rounded-xl text-2xl sm:text-3xl font-mono font-bold text-white shadow-inner">-</div>
      <div class="otp-box w-11 h-14 sm:w-12 sm:h-16 flex items-center justify-center bg-slate-800/80 border-2 border-indigo-500/40 rounded-xl text-2xl sm:text-3xl font-mono font-bold text-white shadow-inner">-</div>
      <div class="otp-box w-11 h-14 sm:w-12 sm:h-16 flex items-center justify-center bg-slate-800/80 border-2 border-indigo-500/40 rounded-xl text-2xl sm:text-3xl font-mono font-bold text-white shadow-inner">-</div>
    </div>

    <div class="text-center mb-6">
      <div class="text-xs text-slate-400 mb-2">Код обновится через <span id="timerText" class="font-mono text-indigo-400 font-bold">0:30</span></div>
      <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-indigo-500 h-full w-full transition-all duration-1000 ease-linear"></div>
      </div>
    </div>

    <button id="copyBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 transition active:scale-[0.98] flex items-center justify-center gap-2" type="button">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
      </svg>
      <span id="copyBtnText">Скопировать код</span>
    </button>

    <div class="mt-4 pt-4 border-t border-slate-800">
      <div class="text-xs text-slate-400 mb-2">Бот</div>
      <div class="flex gap-2">
        <button id="openBotBtn" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-100 rounded-xl text-sm font-medium transition" type="button">Открыть бота</button>
        <button id="payBtn" class="flex-1 py-2.5 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 rounded-xl text-sm font-medium transition" type="button">Stars</button>
      </div>
    </div>
  </div>

  <div id="addModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-sm">
      <h3 class="text-lg font-semibold text-white mb-4">Добавить 2FA сервис</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Название</label>
          <input type="text" id="newName" placeholder="GitHub" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Секретный ключ</label>
          <input type="text" id="newSecret" placeholder="JBSWY3DPEHPK3PXP" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="cancelBtn" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium transition" type="button">Отмена</button>
        <button id="saveBtn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition" type="button">Сохранить</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
